# Решателю NIKA оставлено одно ядро: при параллельной работе его потоки блокируют друг друга и он зависает.
services:
  problem-solver:
    cpuset: "0"
  py-sc-server:
    volumes:
      # ЛР4: код агентов (в том числе агент рейтинга TIOBE) берётся из папки проекта, образ остаётся стандартным
      - ./problem-solver/py:/nika/problem-solver/problem-solver/py:ro
